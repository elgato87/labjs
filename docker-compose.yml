name: jumpserver-ha-lab

# ---------------------------------------------------------------------------
# Lab HA de JumpServer en Docker Desktop
#   - 1x PostgreSQL + 1x Redis  (servicios de datos compartidos)
#   - 3x Vault (cluster Raft / Integrated Storage)  -> HA real
#   - 2x JumpServer (jms_all)  -> tier de aplicacion en HA
#   - 1x nginx  -> balanceador (web 80 + ssh 2222) YA configurado
# ---------------------------------------------------------------------------

x-jms-common: &jms-common
  image: ${JMS_IMAGE}
  user: "0"
  restart: unless-stopped
  environment:
    SECRET_KEY: ${SECRET_KEY}
    BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
    DEBUG: "false"
    LOG_LEVEL: ERROR
    # --- Base de datos externa (compartida) ---
    DB_ENGINE: postgresql
    DB_HOST: jms-postgres
    DB_PORT: "5432"
    DB_USER: jumpserver
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: jumpserver
    # --- Redis externo (compartido) ---
    REDIS_HOST: jms-redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    # --- Sesiones/salas compartidas entre nodos ---
    SHARE_ROOM_TYPE: redis
    # --- Integracion Vault (SOLO efectiva en Enterprise Edition) ---
    VAULT_ENABLED: ${VAULT_ENABLED}
    VAULT_BACKEND: hcp
    VAULT_HCP_HOST: http://vault1:8200
    VAULT_HCP_TOKEN: ${VAULT_HCP_TOKEN}
    VAULT_HCP_MOUNT_POINT: jumpserver
  depends_on:
    jms-postgres:
      condition: service_healthy
    jms-redis:
      condition: service_healthy

services:
  # ------------------------- Datos -------------------------
  jms-postgres:
    image: postgres:16-bookworm
    container_name: jms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jumpserver
      POSTGRES_USER: jumpserver
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jumpserver -d jumpserver"]
      interval: 5s
      timeout: 5s
      retries: 20

  jms-redis:
    image: redis:7-alpine
    container_name: jms-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------- Vault (Raft HA) -------------------------
  vault1:
    image: hashicorp/vault:1.17
    container_name: vault1
    restart: unless-stopped
    user: "0"
    cap_add: ["IPC_LOCK"]
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault1.hcl:/vault/config/vault.hcl:ro
      - vault1-data:/vault/data
    ports:
      - "8200:8200"

  vault2:
    image: hashicorp/vault:1.17
    container_name: vault2
    restart: unless-stopped
    user: "0"
    cap_add: ["IPC_LOCK"]
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault2.hcl:/vault/config/vault.hcl:ro
      - vault2-data:/vault/data
    ports:
      - "8210:8200"

  vault3:
    image: hashicorp/vault:1.17
    container_name: vault3
    restart: unless-stopped
    user: "0"
    cap_add: ["IPC_LOCK"]
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault3.hcl:/vault/config/vault.hcl:ro
      - vault3-data:/vault/data
    ports:
      - "8220:8200"

  # ------------------------- JumpServer (2 nodos) -------------------------
  jms-node1:
    <<: *jms-common
    container_name: jms-node1
    hostname: jms-node1
    volumes:
      - media:/opt/jumpserver/data/media

  jms-node2:
    <<: *jms-common
    container_name: jms-node2
    hostname: jms-node2
    volumes:
      - media:/opt/jumpserver/data/media
    # Arranca despues del nodo 1 para evitar carrera de migraciones de BD.
    depends_on:
      jms-postgres:
        condition: service_healthy
      jms-redis:
        condition: service_healthy
      jms-node1:
        condition: service_started

  # ------------------------- Balanceador -------------------------
  jms-lb:
    image: nginx:1.27-alpine
    container_name: jms-lb
    restart: unless-stopped
    depends_on: ["jms-node1", "jms-node2"]
    ports:
      - "80:80"      # Web  -> http://localhost
      - "2222:2222"  # SSH  -> ssh -p 2222 usuario@localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  media:
  vault1-data:
  vault2-data:
  vault3-data:
