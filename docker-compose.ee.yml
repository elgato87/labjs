version: "3.9"

services:
  # ------------------------- Vault Raft HA -------------------------
  vault1:
    image: hashicorp/vault:1.17
    container_name: vault1
    restart: unless-stopped
    pull_policy: never
    user: "0"
    cap_add:
      - IPC_LOCK
    command: ["/bin/sh", "-c", "chown -R 100:1000 /vault/data && exec vault server -config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault1.hcl:/vault/config/vault.hcl:ro
      - vault1-data:/vault/data
    ports:
      - "8200:8200"
    networks:
      - jumpserver-net

  vault2:
    image: hashicorp/vault:1.17
    container_name: vault2
    restart: unless-stopped
    pull_policy: never
    user: "0"
    cap_add:
      - IPC_LOCK
    command: ["/bin/sh", "-c", "chown -R 100:1000 /vault/data && exec vault server -config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault2.hcl:/vault/config/vault.hcl:ro
      - vault2-data:/vault/data
    ports:
      - "8210:8200"
    networks:
      - jumpserver-net

  vault3:
    image: hashicorp/vault:1.17
    container_name: vault3
    restart: unless-stopped
    pull_policy: never
    user: "0"
    cap_add:
      - IPC_LOCK
    command: ["/bin/sh", "-c", "chown -R 100:1000 /vault/data && exec vault server -config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/vault3.hcl:/vault/config/vault.hcl:ro
      - vault3-data:/vault/data
    ports:
      - "8220:8200"
    networks:
      - jumpserver-net

  # ------------------------- Shared infrastructure -------------------------
  postgresql:
    image: postgres:16.10-bookworm
    container_name: jms_postgresql
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env.ee
    environment:
      POSTGRES_DB: ${DB_NAME:-jumpserver}
      POSTGRES_USER: ${DB_USER:-jumpserver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - jumpserver-net

  redis:
    image: redis:7.4.6-bookworm
    container_name: jms_redis
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env.ee
    command: ["sh", "-c", "redis-server /etc/redis.conf --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/redis/redis.conf:/etc/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - jumpserver-net

  # ------------------------- JumpServer EE application services -------------------------
  core:
    image: jumpserver/core:v4.10.17-ee
    container_name: jms_core
    restart: unless-stopped
    pull_policy: never
    privileged: true
    command: ["start", "web"]
    env_file:
      - .env.ee
    volumes:
      - core-data:/opt/jumpserver/data
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/certs:/opt/jumpserver/data/certs:ro
    depends_on:
      - postgresql
      - redis
      - vault1
      - vault2
      - vault3
    networks:
      - jumpserver-net

  celery:
    image: jumpserver/core:v4.10.17-ee
    container_name: jms_celery
    restart: unless-stopped
    pull_policy: never
    privileged: true
    command: ["start", "task"]
    env_file:
      - .env.ee
    volumes:
      - core-data:/opt/jumpserver/data
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/certs:/opt/jumpserver/data/certs:ro
    depends_on:
      - core
      - postgresql
      - redis
    networks:
      - jumpserver-net

  web1:
    image: jumpserver/web:v4.10.17-ee
    container_name: jms_web1
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env.ee
    environment:
      HTTP_PORT: 80
      USE_LB: "1"
      GZIP: on
      CLIENT_MAX_BODY_SIZE: 4096m
    volumes:
      - core-data:/opt/jumpserver/data
      - web1-logs:/var/log/nginx
      - /sys/fs/bpf:/sys/fs/bpf
    depends_on:
      - core
      - postgresql
      - redis
    networks:
      - jumpserver-net

  web2:
    image: jumpserver/web:v4.10.17-ee
    container_name: jms_web2
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env.ee
    environment:
      HTTP_PORT: 80
      USE_LB: "1"
      GZIP: on
      CLIENT_MAX_BODY_SIZE: 4096m
    volumes:
      - core-data:/opt/jumpserver/data
      - web2-logs:/var/log/nginx
      - /sys/fs/bpf:/sys/fs/bpf
    depends_on:
      - core
      - postgresql
      - redis
    networks:
      - jumpserver-net

  nginx:
    image: nginx:1.27-alpine
    container_name: jms_lb
    restart: unless-stopped
    pull_policy: never
    ports:
      - "80:80"
    volumes:
      - ./nginx/ee-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    networks:
      - jumpserver-net

  koko:
    image: jumpserver/koko:v4.10.17-ee
    container_name: jms_koko
    restart: unless-stopped
    pull_policy: never
    privileged: true
    ports:
      - "2222:2222"
    env_file:
      - .env.ee
    volumes:
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/certs:/opt/koko/data/certs:ro
      - koko-data:/opt/koko/data
    depends_on:
      - core
      - redis
    networks:
      - jumpserver-net

  lion:
    image: jumpserver/lion:v4.10.17-ee
    container_name: jms_lion
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env.ee
    volumes:
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/certs:/opt/lion/data/certs:ro
      - lion-data:/opt/lion/data
    depends_on:
      - core
      - redis
    networks:
      - jumpserver-net

  chen:
    image: jumpserver/chen:v4.10.17-ee
    container_name: jms_chen
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env.ee
    volumes:
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/certs:/opt/chen/data/certs:ro
      - chen-data:/opt/chen/data
    depends_on:
      - core
      - redis
    networks:
      - jumpserver-net

  razor:
    image: jumpserver/razor:v4.10.17-ee
    container_name: jms_razor
    restart: unless-stopped
    pull_policy: never
    ports:
      - "3389:3389"
    env_file:
      - .env.ee
    volumes:
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/nginx/cert:/opt/razor/cert:ro
      - razor-data:/opt/razor/data
    depends_on:
      - core
      - redis
    networks:
      - jumpserver-net

  xrdp:
    image: jumpserver/xrdp:v4.10.17-ee
    container_name: jms_xrdp
    restart: unless-stopped
    pull_policy: never
    ports:
      - "3390:3390"
    env_file:
      - .env.ee
    volumes:
      - xrdp-data:/opt/xrdp/data
      - ./jumpserver-ee-v4.10.17-x86_64/config_init/nginx/cert:/opt/xrdp/cert:ro
    depends_on:
      - core
      - redis
    networks:
      - jumpserver-net

  panda:
    image: jumpserver/panda:v4.10.17-ee
    container_name: jms_panda
    restart: unless-stopped
    pull_policy: never
    env_file:
      - .env.ee
    volumes:
      - panda-data:/opt/panda/data
    depends_on:
      - core
      - redis
    networks:
      - jumpserver-net

  video:
    image: jumpserver/video-worker:v4.10.17-ee
    container_name: jms_video
    restart: unless-stopped
    pull_policy: never
    cpus: 2
    env_file:
      - .env.ee
    volumes:
      - video-data:/opt/video-worker/data
    depends_on:
      - core
      - redis
    networks:
      - jumpserver-net

volumes:
  pgdata:
  redisdata:
  core-data:
  web1-logs:
  web2-logs:
  koko-data:
  lion-data:
  chen-data:
  razor-data:
  xrdp-data:
  panda-data:
  video-data:
  vault1-data:
  vault2-data:
  vault3-data:

networks:
  jumpserver-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.250.0/24
