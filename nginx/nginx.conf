# Balanceador del lab: reparte web (HTTP/WebSocket) y SSH entre los 2 nodos.
# No necesitás editar nada; el compose lo monta y arranca solo.

user  nginx;
worker_processes  auto;
events { worker_connections 1024; }

# -------- HTTP: consola web + terminal por navegador (WebSocket) --------
http {
    upstream jms_web {
        ip_hash;                 # afinidad por IP (ayuda al WebSocket del terminal)
        server jms-node1:80 max_fails=3 fail_timeout=10s;
        server jms-node2:80 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 4096m;   # subidas grandes (ISOs, archivos por SFTP web)

        location / {
            proxy_pass http://jms_web;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;   # WebSocket
            proxy_set_header Connection "upgrade";
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
        }
    }
}

# -------- STREAM: SSH proxy (KoKo) en TCP --------
stream {
    upstream jms_ssh {
        server jms-node1:2222 max_fails=3 fail_timeout=10s;
        server jms-node2:2222 max_fails=3 fail_timeout=10s;
    }
    server {
        listen 2222;
        proxy_pass jms_ssh;
        proxy_timeout 600s;
    }
}
